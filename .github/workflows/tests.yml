name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pypdf is optional at runtime; CI installs it so the PDF authority path is tested.
      - run: python -m pip install -r requirements.txt pypdf
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests
      - name: Domain packs
        run: python -X utf8 scripts/benchmark.py packs
